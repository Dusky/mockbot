[markov]
default_order = 2
max_overlap_ratio = 0.7
max_overlap_total = 15
max_attempts = 30
min_words = 3
max_words = 35
strip_urls = true
badwords_file = "badwords.txt"

[storage]
db_path = "ansv2.db"
