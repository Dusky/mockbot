[twitch]
nickname = "anormalskipviewer"
oauth_token = "oauth:your_token_here"
command_prefix = "!ansv"

mockbot_nickname = "mockbot"
mockbot_oauth_token = ""
mockbot_command_prefix = "!mockbot"

client_id = ""
client_secret = ""
oauth_redirect_uri = "https://mockbot.xyz/auth/twitch/callback"
owner = "firestarman"
initial_channels = ["firestarman"]
default_ignored_bots = [
    "nightbot",
    "streamelements",
    "moobot",
    "fossabot",
    "wizebot",
    "sery_bot",
    "soundalerts",
    "streamlabs",
    "pokemoncommunitygame",
    "kofistreambot",
    "commanderroot",
]

[web]
bind_addr = "0.0.0.0:5002"
admin_token = "change-me"
public_join_enabled = true
public_join_contribute_global = false
